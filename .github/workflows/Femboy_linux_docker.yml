name: Build Alpine Linux + NVIDIA 580 + Intel + Enlightenment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  KERNEL_VERSION: 5.15.167
  NVIDIA_DRIVER_VERSION: 580.04
  ALPINE_VERSION: 3.18

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.lowercase.outputs.image_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: lowercase
        run: |
          IMAGE_NAME="$(echo '${{ github.repository }}/alpine-nvidia580-enlightenment' | tr '[:upper:]' '[:lower:]')"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.alpine-nvidia580
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate checksums
        run: |
          mkdir -p checksums
          echo "Build completed: ${{ steps.meta.outputs.version }}" > checksums/BUILD_INFO.txt
          echo "Kernel: ${{ env.KERNEL_VERSION }}" >> checksums/BUILD_INFO.txt
          echo "Alpine: ${{ env.ALPINE_VERSION }}" >> checksums/BUILD_INFO.txt
          echo "Desktop: Enlightenment 0.25+" >> checksums/BUILD_INFO.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: checksums/

  test:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Test Docker image
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ needs.build.outputs.image_name }}:latest \
            -c "uname -r 2>/dev/null; echo 'Image runs OK'; openbox --version 2>/dev/null || echo 'Openbox installed'; i3 --version 2>/dev/null || echo 'i3 installed'"
