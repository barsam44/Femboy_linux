name: Build ParisaOS (Cinnamon + Firefox)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iso:
    name: Build Custom ISO
    runs-on: ubuntu-latest
    container:
      image: alpine:edge
      options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apk update
          apk add alpine-sdk build-base apk-tools alpine-conf squashfs-tools xorriso mtools grub-efi dosfstools sudo git

      - name: Create non-root build user
        run: |
          adduser -D -G abuild build
          echo "build ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R build:abuild "$GITHUB_WORKSPACE"

      - name: Setup abuild keys as build user
        run: |
          su build -c "abuild-keygen -a -n"
          cp /home/build/.abuild/*.pub /etc/apk/keys/

      - name: Clone aports repository
        run: |
          git clone --depth 1 https://gitlab.alpinelinux.org/alpine/aports.git /aports
          chown -R build:abuild /aports

      - name: Create ParisaOS Profile
        run: |
          cat << 'EOF' > /aports/scripts/mkimg.parisaos.sh
          profile_parisaos() {
              profile_base
              title="ParisaOS"
              desc="Alpine Linux with Cinnamon and Firefox"
              arch="x86_64"
              kernel_flavors="lts"
              
              # بسته‌های پایه برای یک لایو دیسک استاندارد (بدون تداخل شبکه vlan)
              apks="$apks alpine-base acpid syslinux grub-efi efibootmgr"
              
              # ابزارهای سیستم‌فایل و امضا
              apks="$apks xfsprogs btrfs-progs e2fsprogs dosfstools ntfs-3g exfatprogs"
              
              # زیرساخت گرافیک و درایورهای تصویر
              apks="$apks xorg-server xf86-video-intel xf86-video-amdgpu mesa-dri-gallium"
              
              # محیط دسکتاپ Cinnamon و ابزارهای مدیریت نشست و شبکه
              apks="$apks lightdm cinnamon dbus-x11 sudo networkmanager accountsservice"
              
              # مرورگر وب پیش‌فرض
              apks="$apks firefox"
          }
          EOF
          chown build:abuild /aports/scripts/mkimg.parisaos.sh

      - name: Build the ISO Image
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          chown -R build:abuild "$GITHUB_WORKSPACE/output"
          
          cd /aports/scripts
          # اضافه کردن مخزن testing در انتهای خطوط برای مجاز کردن دانلود دارایی‌های دسکتاپ Cinnamon
          su build -c "sh mkimage.sh --profile parisaos \
            --outdir $GITHUB_WORKSPACE/output \
            --repository https://dl-cdn.alpinelinux.org/alpine/edge/main \
            --repository https://dl-cdn.alpinelinux.org/alpine/edge/community \
            --repository https://dl-cdn.alpinelinux.org/alpine/edge/testing"

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParisaOS-x86_64-Live-Cinnamon
          path: output/*.iso
