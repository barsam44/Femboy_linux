name: Build Femboy Alpine (Cinnamon + Nouveau + Mesa + Chromium)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iso:
    name: Build Custom Alpine ISO
    runs-on: ubuntu-latest
    container:
      image: alpine:edge
      options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apk update
          apk add alpine-sdk build-base apk-tools alpine-conf squashfs-tools xorriso mtools grub-efi dosfstools sudo git

      - name: Create non-root build user
        run: |
          adduser -D -G abuild build
          echo "build ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R build:abuild "$GITHUB_WORKSPACE"

      - name: Setup abuild keys as build user
        run: |
          su build -c "abuild-keygen -a -n"
          cp /home/build/.abuild/*.pub /etc/apk/keys/

      - name: Clone aports repository
        run: |
          git clone --depth 1 https://gitlab.alpinelinux.org/alpine/aports.git /aports
          chown -R build:abuild /aports

      - name: Create Femboy Alpine Profile
        run: |
          cat << 'EOF' > /aports/scripts/mkimg.femboy-alpine.sh
          profile_femboy_alpine() {
              profile_base
              title="Femboy Alpine"
              desc="Alpine Linux with Cinnamon, Nouveau, Mesa, and Chromium"
              arch="x86_64"
              kernel_flavors="lts"

              # Base packages for a live disk
              apks="$apks alpine-base acpid syslinux grub-efi efibootmgr"

              # Filesystem and signature tools
              apks="$apks xfsprogs btrfs-progs e2fsprogs dosfstools ntfs-3g exfatprogs"

              # Graphics infrastructure and drivers (Nouveau + Mesa)
              apks="$apks xorg-server xf86-video-nouveau mesa-dri-gallium mesa-va-gallium mesa-gl"

              # Cinnamon desktop environment and session management
              apks="$apks lightdm cinnamon dbus-x11 sudo networkmanager accountsservice polkit"

              # Chromium-based browser
              apks="$apks chromium"

              # Additional utilities
              apks="$apks bash curl wget"
          }
          EOF
          chown build:abuild /aports/scripts/mkimg.femboy-alpine.sh

      - name: Build the ISO Image
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          chown -R build:abuild "$GITHUB_WORKSPACE/output"

          cd /aports/scripts
          su build -c "sh mkimage.sh --profile femboy_alpine \
            --outdir $GITHUB_WORKSPACE/output \
            --repository https://dl-cdn.alpinelinux.org/alpine/edge/main \
            --repository https://dl-cdn.alpinelinux.org/alpine/edge/community \
            --repository https://dl-cdn.alpinelinux.org/alpine/edge/testing"

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Femboy-Alpine-x86_64-Live-Cinnamon-Nouveau
          path: output/*.iso
