name: Build ParisaOS (Cinnamon + Firefox + GUI Installer)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iso:
    name: Build Custom ISO
    runs-on: ubuntu-latest
    container:
      image: alpine:edge
      options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apk update
          apk add alpine-sdk build-base apk-tools alpine-conf squashfs-tools xorriso mtools grub-efi dosfstools sudo

      - name: Setup abuild and aports repository
        run: |
          git clone --depth 1 https://gitlab.alpinelinux.org/alpine/aports.git /aports
          abuild-keygen -a -i -n

      - name: Create ParisaOS Profile
        run: |
          cat << 'EOF' > /aports/scripts/mkimg.parisaos.sh
          profile_parisaos() {
              profile_standard
              title="ParisaOS"
              desc="Alpine Linux with Cinnamon, Firefox, and Calamares Installer"
              arch="x86_64"
              kernel_flavors="lts"
              
              # فایل‌سیستم‌های ضروری (از جمله XFS)
              apks="$apks xfsprogs btrfs-progs e2fsprogs dosfstools ntfs-3g exfatprogs"
              
              # درایورهای گرافیکی و رابط کاربری سینامون
              apks="$apks xorg-server xf86-video-intel xf86-video-amdgpu mesa-dri-gallium"
              apks="$apks lightdm cinnamon dbus-x11 sudo networkmanager"
              
              # مرورگر وب
              apks="$apks firefox"
              
              # نصاب گرافیکی (GUI Installer)
              apks="$apks calamares calamares-alpine"
          }
          EOF

      - name: Build the ISO Image
        run: |
          cd /aports/scripts
          mkdir -p /github/workspace/output
          
          # استفاده از سینتکس صحیح با دو خط تیره
          sh mkimage.sh --profile parisaos --outdir /github/workspace/output

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParisaOS-x86_64-Live-GUI
          path: /github/workspace/output/*.iso
