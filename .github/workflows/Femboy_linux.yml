name: Build Custom Alpine OS (Cinnamon & XFS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iso:
    name: Build Custom ISO
    runs-on: ubuntu-latest
    container:
      image: alpine:edge
      options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apk update
          apk add alpine-sdk build-base apk-tools alpine-conf squashfs-tools xorriso mtools grub-efi dosfstools sudo

      - name: Setup abuild and aports repository
        run: |
          git clone --depth 1 https://gitlab.alpinelinux.org/alpine/aports.git /aports
          # ایجاد کلید برای بیلد پکیج‌ها و ایمیج
          abuild-keygen -a -i -n

      - name: Create Custom OS Profile
        run: |
          cat << 'EOF' > /aports/scripts/mkimg.customos.sh
          profile_customos() {
              profile_standard
              title="CustomOS-Cinnamon"
              desc="Alpine Linux with Cinnamon UI and XFS/BTRFS support"
              arch="x86_64"
              kernel_flavors="lts"
              
              # افزودن ابزارهای فایل‌سیستم
              apks="$apks xfsprogs btrfs-progs e2fsprogs dosfstools ntfs-3g exfatprogs"
              
              # افزودن درایورهای گرافیکی و سرور نمایش
              apks="$apks xorg-server xf86-video-intel xf86-video-amdgpu mesa-dri-gallium"
              
              # افزودن محیط دسکتاپ سینامون و نیازمندی‌های شبکه و ورود
              apks="$apks lightdm cinnamon dbus-x11 sudo networkmanager dbus-x11"
          }
          EOF

      - name: Build the ISO Image
        run: |
          cd /aports/scripts
          mkdir -p /github/workspace/output
          # کامپایل ایمیج با پروفایل ساخته شده
          sh mkimage.sh -p customos -outdir /github/workspace/output

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: customos-cinnamon-x86_64-iso
          path: /github/workspace/output/*.iso
