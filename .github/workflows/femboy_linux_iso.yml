name: Build Alpine Linux ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  KERNEL_VERSION: 5.15.167
  NVIDIA_DRIVER_VERSION: 580.04
  ALPINE_VERSION: 3.18

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate ISO name
        id: iso
        run: |
          ISO_NAME="alpine-${{ env.ALPINE_VERSION }}-kernel${{ env.KERNEL_VERSION }}-nvidia${{ env.NVIDIA_DRIVER_VERSION }}-intel-lxqt.iso"
          echo "iso_name=$(echo "$ISO_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Install Alpine mkimage tools
        run: |
          sudo apt update
          sudo apt install -y alpine-make-vm-image squashfs-tools xorriso

      - name: Build custom Alpine ISO
        id: buildiso
        run: |
          mkdir -p iso
          alpine-make-vm-image \
            --branch v${{ env.ALPINE_VERSION }} \
            --image-format iso \
            --kernel-version ${{ env.KERNEL_VERSION }} \
            --packages "alpine-base e2fsprogs eudev udev-init-tools \
                        linux-firmware-intel linux-firmware-nvidia \
                        nvidia-${{ env.NVIDIA_DRIVER_VERSION }} \
                        mesa-dri-intel mesa-vaapi-intel mesa-vulkan-intel \
                        lxqt lxqt-panel lxqt-session openbox \
                        sddm sddm-openrc \
                        networkmanager networkmanager-openrc" \
            iso/${{ steps.iso.outputs.iso_name }}

      - name: Generate build info
        run: |
          mkdir -p checksums
          echo "ISO: ${{ steps.iso.outputs.iso_name }}" > checksums/BUILD_INFO.txt
          echo "Kernel: ${{ env.KERNEL_VERSION }}" >> checksums/BUILD_INFO.txt
          echo "Alpine: ${{ env.ALPINE_VERSION }}" >> checksums/BUILD_INFO.txt
          echo "NVIDIA: ${{ env.NVIDIA_DRIVER_VERSION }}" >> checksums/BUILD_INFO.txt
          echo "Desktop: LXQt" >> checksums/BUILD_INFO.txt

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.iso.outputs.iso_name }}
          path: iso/${{ steps.iso.outputs.iso_name }}

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: checksums/
