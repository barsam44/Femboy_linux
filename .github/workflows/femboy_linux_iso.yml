name: Build Alpine Linux + NVIDIA 580 + Intel + Enlightenment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  KERNEL_VERSION: 5.15.167
  NVIDIA_DRIVER_VERSION: 580.04
  ALPINE_VERSION: 3.18

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      iso_name: ${{ steps.iso.outputs.iso_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Generate ISO name
      # ---------------------------------------------------------
      - name: Generate ISO name
        id: iso
        run: |
          ISO_NAME="alpine-${{ env.ALPINE_VERSION }}-kernel${{ env.KERNEL_VERSION }}-nvidia${{ env.NVIDIA_DRIVER_VERSION }}-intel-enlightenment.iso"
          ISO_NAME_LOWER="$(echo "$ISO_NAME" | tr '[:upper:]' '[:lower:]')"
          echo "iso_name=${ISO_NAME_LOWER}" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # Install Alpine mkimage dependencies
      # ---------------------------------------------------------
      - name: Install mkimage dependencies
        run: |
          sudo apt update
          sudo apt install -y squashfs-tools xorriso apk-tools curl

      # ---------------------------------------------------------
      # Download official Alpine mkimage scripts
      # ---------------------------------------------------------
      - name: Download mkimage scripts
        run: |
          curl -LO https://raw.githubusercontent.com/alpinelinux/alpine-make-vm-image/master/mkimage.sh
          chmod +x mkimage.sh

      # ---------------------------------------------------------
      # Build custom Alpine ISO
      # ---------------------------------------------------------
      - name: Build custom Alpine ISO
        run: |
          mkdir iso
          sudo ./mkimage.sh \
            --tag v${{ env.ALPINE_VERSION }} \
            --arch x86_64 \
            --repository http://dl-cdn.alpinelinux.org/alpine/v${{ env.ALPINE_VERSION }}/main \
            --profile virt \
            --packages "alpine-base e2fsprogs eudev udev-init-tools \
                        linux-firmware-intel linux-firmware-nvidia \
                        nvidia-${{ env.NVIDIA_DRIVER_VERSION }} \
                        enlightenment" \
            iso/${{ steps.iso.outputs.iso_name }}

      # ---------------------------------------------------------
      # Upload ISO
      # ---------------------------------------------------------
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.iso.outputs.iso_name }}
          path: iso/${{ steps.iso.outputs.iso_name }}

      # ---------------------------------------------------------
      # Upload build info
      # ---------------------------------------------------------
      - name: Upload build info
        run: |
          mkdir -p checksums
          echo "ISO: ${{ steps.iso.outputs.iso_name }}" > checksums/BUILD_INFO.txt
          echo "Kernel: ${{ env.KERNEL_VERSION }}" >> checksums/BUILD_INFO.txt
          echo "Alpine: ${{ env.ALPINE_VERSION }}" >> checksums/BUILD_INFO.txt
          echo "NVIDIA: ${{ env.NVIDIA_DRIVER_VERSION }}" >> checksums/BUILD_INFO.txt
          echo "Desktop: Enlightenment" >> checksums/BUILD_INFO.txt

      - name: Upload build-info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: checksums/

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Print ISO name
        run: echo "Built ISO: ${{ needs.build.outputs.iso_name }}"
