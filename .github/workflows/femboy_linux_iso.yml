name: Build Alpine Linux ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  KERNEL_VERSION: 5.15.167
  NVIDIA_DRIVER_VERSION: 580.04
  ALPINE_VERSION: 3.18

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate ISO name
        id: iso
        run: |
          ISO_NAME="alpine-${{ env.ALPINE_VERSION }}-kernel${{ env.KERNEL_VERSION }}-nvidia${{ env.NVIDIA_DRIVER_VERSION }}-intel-enlightenment.iso"
          echo "iso_name=$(echo "$ISO_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Install QEMU
        run: |
          sudo apt update
          sudo apt install -y qemu-system-x86 qemu-utils

      - name: Download Alpine Mini RootFS
        run: |
          wget https://dl-cdn.alpinelinux.org/alpine/v${{ env.ALPINE_VERSION }}/releases/x86_64/alpine-minirootfs-${{ env.ALPINE_VERSION }}.0-x86_64.tar.gz
          mkdir rootfs
          sudo tar -xzf alpine-minirootfs-${{ env.ALPINE_VERSION }}.0-x86_64.tar.gz -C rootfs

      - name: Create VM disk
        run: |
          qemu-img create -f qcow2 alpine.qcow2 4G

      - name: Boot Alpine VM and build ISO
        run: |
          qemu-system-x86_64 \
            -m 2048 \
            -smp 2 \
            -nographic \
            -kernel rootfs/boot/vmlinuz-lts \
            -initrd rootfs/boot/initramfs-lts \
            -append "console=ttyS0 root=/dev/ram0" \
            -drive file=alpine.qcow2,format=qcow2 \
            -virtfs local,path=$PWD,mount_tag=host0,security_model=none \
            -no-reboot \
            -serial mon:stdio \
            -serial file:vm.log

      - name: Extract ISO from VM
        run: |
          mkdir iso
          cp alpine.qcow2 iso/${{ steps.iso.outputs.iso_name }}

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.iso.outputs.iso_name }}
          path: iso/${{ steps.iso.outputs.iso_name }}
